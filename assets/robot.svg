<!-- The FEMBOTS robot, same shapes as the mark in Midnight Broker (FembotsMark.svelte). The eye details are cut out. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="6 0 188 180">
  <defs>
    <clipPath id="rb-eye"><ellipse cx="100" cy="108" rx="43.5" ry="51"/></clipPath>
    <mask id="rb-cut" maskUnits="userSpaceOnUse" x="-10" y="-10" width="220" height="220">
      <rect x="-10" y="-10" width="220" height="220" fill="#fff"/>
      <g clip-path="url(#rb-eye)"><ellipse cx="103" cy="112.5" rx="22.5" ry="27" fill="#000"/><ellipse cx="94.45" cy="101.4" rx="8.25" ry="9.75" fill="#fff"/><ellipse cx="110.95" cy="122.4" rx="4.2" ry="4.8" fill="#fff"/><path d="M39.1 -45H160.9V82.5Q100 109.02 39.1 82.5Z" fill="#fff"/><path d="M39.1 82.5Q100 109.02 160.9 82.5" fill="none" stroke="#000" stroke-width="3.9"/></g>
      <ellipse cx="100" cy="108" rx="46" ry="53.5" fill="none" stroke="#000" stroke-width="5.5"/>
    </mask>
  </defs>
  <g fill="#fff" mask="url(#rb-cut)"><rect x="96.5" y="20" width="7" height="20" rx="3.5"/><circle cx="100" cy="15" r="10"/><rect x="12" y="84" width="14" height="44" rx="7"/><rect x="174" y="84" width="14" height="44" rx="7"/><rect x="30" y="36" width="140" height="138" rx="44"/></g>
</svg>
