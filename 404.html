<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page not found | FEMBOTS</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#09090d" />
  <!-- GitHub Pages serves this page for any missing address, at any depth, so links point at /website/.
       The fonts fall back to a relative path so the page also looks right when opened locally. -->
  <link rel="icon" type="image/svg+xml" href="/website/assets/robot.svg" />
  <style>
    @font-face { font-family: 'Bungee'; font-weight: 400; font-display: swap; src: url(/website/assets/fonts/bungee-latin.woff2) format('woff2'), url(assets/fonts/bungee-latin.woff2) format('woff2'); }
    @font-face { font-family: 'Inter'; font-weight: 100 900; font-display: swap; src: url(/website/assets/fonts/inter-latin.woff2) format('woff2'), url(assets/fonts/inter-latin.woff2) format('woff2'); }
    :root { --bg: #09090d; --ink: #f4f3f8; --muted: #9b9aa8; --accent: #9d8bff; --pink: #ff3d6e; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; }
    body {
      position: relative; overflow: hidden; display: grid; place-items: center; padding: 32px 16px; text-align: center;
      background: var(--bg); color: var(--ink);
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; -webkit-font-smoothing: antialiased;
    }

    /* ---- Backdrop: a soft violet glow ---- */
    .glow { position: fixed; inset: 0; background: radial-gradient(ellipse 60% 45% at 50% 40%, rgba(157,139,255,.22), transparent 70%); pointer-events: none; }

    main { position: relative; z-index: 1; max-width: 560px; }

    /* ---- The dead robot ---- */
    .bot { position: relative; width: clamp(120px, 30vw, 160px); margin: 0 auto 8px; transform: rotate(-14deg); animation: twitch 5s infinite; }
    .bot svg { display: block; width: 100%; height: auto; overflow: visible; filter: drop-shadow(0 0 22px rgba(157,139,255,.45)); }
    /* Every so often it jolts, like a last spark went through it. */
    @keyframes twitch { 0%, 86%, 100% { transform: rotate(-14deg); } 88% { transform: rotate(-9deg) translateY(-3px); } 90% { transform: rotate(-16deg); } 92% { transform: rotate(-12deg); } 94% { transform: rotate(-14deg); } }
    /* Smoke from the top of its head. */
    .smoke { position: absolute; left: 58%; top: 16%; width: 0; height: 0; pointer-events: none; }
    .smoke i { position: absolute; left: -9px; top: -9px; width: 18px; height: 18px; border-radius: 50%;
      background: rgba(200,196,220,.5); filter: blur(5px); opacity: 0; animation: puff 3.6s ease-out infinite; }
    .smoke i:nth-child(2) { animation-delay: 1.2s; }
    .smoke i:nth-child(3) { animation-delay: 2.4s; }
    @keyframes puff { 0% { opacity: 0; transform: translate(0, 0) scale(.5); } 15% { opacity: .7; } 100% { opacity: 0; transform: translate(26px, -90px) scale(2.6); } }
    .shadow { width: 110px; height: 14px; margin: 0 auto 18px; border-radius: 50%; background: radial-gradient(rgba(157,139,255,.35), transparent 70%); }

    /* ---- 404 ---- */
    .code { position: relative; display: inline-block; font-family: 'Bungee', system-ui, sans-serif; font-size: clamp(5rem, 26vw, 9.5rem); line-height: .9; letter-spacing: .04em;
      color: var(--ink); text-shadow: 0 0 40px rgba(157,139,255,.55); }

    h1 { margin: 22px 0 12px; font-family: 'Bungee', system-ui, sans-serif; font-weight: 400; font-size: clamp(1.5rem, 6vw, 2.2rem); }
    p { color: var(--muted); margin-bottom: 30px; }
    /* Same look as the spotlight arrows on the main site: a rounded square-ish tile in see-through violet
       that fills with violet on hover, while the arrow nudges back toward home. */
    a {
      display: inline-flex; align-items: center; gap: 12px; height: 50px; padding: 0 22px 0 18px;
      border-radius: 14px; border: 1px solid rgba(157,139,255,.25); background: rgba(157,139,255,.1); color: #b9adff;
      text-decoration: none; font-weight: 800; font-size: .85rem; letter-spacing: .14em; text-transform: uppercase;
      transition: background .2s, border-color .2s, color .2s;
    }
    a .arrow { display: grid; place-items: center; transition: transform .2s; }
    a svg { width: 20px; height: 20px; }
    a:hover { background: var(--accent); border-color: var(--accent); color: #0b0a14; }
    a:hover .arrow { transform: translateX(-3px); }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; }
    }
  </style>
</head>
<body>
  <div class="glow" aria-hidden="true"></div>

  <main>
    <div class="bot" aria-hidden="true">
      <!-- The FEMBOTS robot, knocked out: an X where the eye should be. -->
      <svg viewBox="6 0 188 180">
        <defs>
          <mask id="dead" maskUnits="userSpaceOnUse" x="-10" y="-10" width="220" height="220">
            <rect x="-10" y="-10" width="220" height="220" fill="#fff"/>
            <ellipse cx="100" cy="108" rx="46" ry="53.5" fill="none" stroke="#000" stroke-width="5.5"/>
            <path d="M80 86 120 130M120 86 80 130" stroke="#000" stroke-width="11" stroke-linecap="round"/>
          </mask>
        </defs>
        <g fill="#fff" mask="url(#dead)"><rect x="96.5" y="20" width="7" height="20" rx="3.5"/><circle cx="100" cy="15" r="10"/><rect x="12" y="84" width="14" height="44" rx="7"/><rect x="174" y="84" width="14" height="44" rx="7"/><rect x="30" y="36" width="140" height="138" rx="44"/></g>
        
      </svg>
      <div class="smoke"><i></i><i></i><i></i></div>
    </div>
    <div class="shadow" aria-hidden="true"></div>

    <div class="code" aria-hidden="true">404</div>
    <h1>Page not found</h1>
    <p>This page doesn't exist or has moved.</p>
    <a href="/website/"><span class="arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></span>Back to the site</a>
  </main>
</body>
</html>
